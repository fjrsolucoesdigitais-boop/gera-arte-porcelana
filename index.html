<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Prompt para Porcelana Memorial</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 750px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a252f; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        
        .upload-section { border: 2px dashed #4a90e2; background: #f4f8ff; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-section:hover { background: #e8f1fd; }
        .preview-img { max-width: 160px; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; border: 2px solid #ccc; object-fit: cover; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        label { font-weight: 600; font-size: 13px; color: #444; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; font-size: 14px; border: 1px solid #dcdfe6; outline: none; }
        input:focus, textarea:focus { border-color: #4a90e2; }

        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-gerar { background: #1a365d; color: white; }
        .btn-gerar:hover { background: #2a4365; }
        .btn-copiar { background: #28a745; color: white; display: none; }
        .btn-copiar:hover { background: #218838; }

        .output-box { margin-top: 25px; background: #2d3748; color: #edf2f7; padding: 18px; border-radius: 8px; font-family: monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de Prompt para Porcelana</h1>
    <p class="subtitle">Monte a estrutura perfeita para criar a arte plana de impressão</p>

    <!-- Upload de Foto (Apenas Pré-visualização Local) -->
    <label>1. Foto do Homenageado (Conferência Visual):</label>
    <div class="upload-section" onclick="document.getElementById('fotoInput').click()">
        <span id="uploadText">📷 Clique para carregar a foto do homenageado</span>
        <input type="file" id="fotoInput" accept="image/*" style="display:none;" onchange="previewFoto(event)">
        <center><img id="imgPreview" class="preview-img" alt="Foto Selecionada"></center>
    </div>

    <!-- Formulário de Dados -->
    <div class="form-grid">
        <div class="full-width">
            <label>Nome Completo do Homenageado:</label>
            <input type="text" id="nome" value="Silmar José dos Anjos">
        </div>

        <div>
            <label>Data de Nascimento:</label>
            <input type="text" id="dataNasc" value="02/12/1984">
        </div>

        <div>
            <label>Data de Falecimento:</label>
            <input type="text" id="dataFalesc" value="15/09/2024">
        </div>

        <div>
            <label>Tamanho da Placa:</label>
            <input type="text" id="tamanho" value="9x12 cm">
        </div>

        <div>
            <label>Formato:</label>
            <select id="formato">
                <option value="elíptico (oval)" selected>Elíptico / Oval</option>
                <option value="retangular">Retangular</option>
            </select>
        </div>

        <div class="full-width">
            <label>Frase Memorial:</label>
            <textarea id="frase" rows="2">Aquele que amamos não se ausenta, se traduz em eternidade e Saudade</textarea>
        </div>

        <div>
            <label>Estilo do Fundo:</label>
            <input type="text" id="fundo" value="Campos suaves e flores delicadas em tons serenos">
        </div>

        <div>
            <label>Estilo da Borda:</label>
            <input type="text" id="borda" value="Dourado estilo cordão trançado">
        </div>
    </div>

    <div class="btn-container">
        <button class="btn-gerar" onclick="gerarPromptTexto()">CRIAR PROMPT FORMATADO</button>
        <button id="btnCopiar" class="btn-copiar" onclick="copiarPromptTexto()">📋 COPIAR PROMPT</button>
    </div>

    <div id="promptOutput" class="output-box"></div>
</div>

<script>
function previewFoto(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const output = document.getElementById('imgPreview');
        output.src = reader.result;
        output.style.display = 'block';
        document.getElementById('uploadText').innerText = "✅ Foto carregada com sucesso!";
    };
    if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function gerarPromptTexto() {
    const nome = document.getElementById('nome').value;
    const dataNasc = document.getElementById('dataNasc').value;
    const dataFalesc = document.getElementById('dataFalesc').value;
    const tamanho = document.getElementById('tamanho').value;
    const formato = document.getElementById('formato').value;
    const frase = document.getElementById('frase').value;
    const fundo = document.getElementById('fundo').value;
    const borda = document.getElementById('borda').value;
    const temFoto = document.getElementById('fotoInput').files.length > 0;

    let instrucaoFoto = temFoto 
        ? "Insira o retrato principal em destaque no centro da composição, ocupando a maior parte do espaço e com acabamento de alta nitidez." 
        : "Deixe um espaço de retrato central amplo e destacado como elemento principal da peça.";

    const promptText = `ARTE GRAPHICA PLANA PRONTA PARA IMPRESSÃO EM PORCELANA (DESIGN 2D, SEM MOCKUP 3D DE TÚMBULO OU PERSPECTIVA)

- Formato da Peça: Placa de porcelana em formato ${formato}, tamanho ${tamanho}.
- Elemento Central: ${instrucaoFoto}
- Nome do Homenageado: "${nome}" em destaque superior/centralizado, utilizando tipografia estilo caligrafia dourada elegante.
- Datas Comemorativas: "${dataNasc} - ${dataFalesc}" em fonte limpa e perfeitamente legível posicionado logo abaixo da imagem.
- Frase Memorial: "${frase}" disposta na parte inferior em fonte serifada delicada.
- Fundo Gráfico: Paisagem suave de ${fundo}, integrada sutilmente ao fundo da peça.
- Borda: Moldura perfeitamente contínua com acabamento em ${borda}.
- Especificação Técnica: Design direto em 2D, alta resolução (300 DPI), iluminação frontal limpa, pronto para envio ao forno/impressora cerâmica.`;

    const output = document.getElementById('promptOutput');
    output.innerText = promptText;
    output.style.display = 'block';
    
    document.getElementById('btnCopiar').style.display = 'block';
}

function copiarPromptTexto() {
    const texto = document.getElementById('promptOutput').innerText;
    navigator.clipboard.writeText(texto).then(() => {
        alert("Prompt copiado com sucesso! Agora basta colar na sua IA de preferência.");
    });
}
</script>

</body>
</html>
